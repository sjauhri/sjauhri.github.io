<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 254" class="diagram"
     role="img" aria-labelledby="dr-title dr-desc">
  <title id="dr-title">Domain randomization in parameter space</title>
  <desc id="dr-desc">Two plots of simulator parameters, friction against mass.
    Left: training in one simulator covers a single point, and the real robot
    lies elsewhere, separated by a sim-to-real gap. Right: randomizing the
    parameters trains across a cloud of simulators around the default, and the
    real robot falls inside that cloud.</desc>

  <!-- Colours come from the page stylesheet
       (partials/figures.html) so the figure follows the theme toggle. -->

  <!-- ============ left: one simulator ============ -->
  <text class="dg-ink dg-h" x="34" y="20">One simulator</text>
    <path class="dg-edge" d="M34 40 V232 H310"/>
    <text class="dg-muted dg-t" x="310" y="250" text-anchor="end">friction →</text>
    <text class="dg-muted dg-t" transform="translate(22 48) rotate(-90)" text-anchor="end">mass →</text>
  <line x1="118" y1="176" x2="222" y2="108" class="dg-edge" stroke-dasharray="4 4"/>
  <text class="dg-muted dg-t" x="180.0" y="158.0">sim-to-real gap</text>
  <circle class="dg-acc-fill" cx="118" cy="176" r="6"/>
  <text class="dg-ink dg-s" x="108" y="198" text-anchor="middle">simulator</text>
    <circle cx="222" cy="108" r="7" style="fill:var(--theme);stroke:var(--dg-ink);stroke-width:2"/>
    <circle cx="222" cy="108" r="2.2" style="fill:var(--dg-ink)"/>
    <text class="dg-ink dg-s dg-strong" x="234" y="94">real robot</text>

  <!-- ============ right: randomized simulators ============ -->
  <text class="dg-ink dg-h" x="434" y="20">Randomized simulators</text>
    <path class="dg-edge" d="M434 40 V232 H710"/>
    <text class="dg-muted dg-t" x="710" y="250" text-anchor="end">friction →</text>
    <text class="dg-muted dg-t" transform="translate(422 48) rotate(-90)" text-anchor="end">mass →</text>
  <ellipse cx="550" cy="140" rx="122" ry="72"
           style="fill:var(--dg-accent-soft);stroke:var(--dg-accent);stroke-width:1;stroke-dasharray:3 4" opacity=".9"/>
