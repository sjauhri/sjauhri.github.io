<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" class="diagram"
     role="img" aria-labelledby="rb-title rb-desc">
  <title id="rb-title">The randomize button</title>
  <desc id="rb-desc">One simulation policy goes in; pressing randomize fans it out
    into thousands of environments varying in texture, lighting, dynamics and
    friction; the resulting policy deploys directly to the real robot.</desc>

  <!-- Colours come from the page stylesheet (partials/figures.html) so the
       diagram follows PaperMod's theme toggle, not just the OS setting. -->

  <!-- ============ 1. one simulation ============ -->
  <g transform="translate(0,86)">
    <rect class="dg-tile" x="14" y="0" width="132" height="94" rx="8"/>
    <path class="dg-edge" d="M44 62 V38 l16-13 16 13 V62 Z"/>
    <path class="dg-edge" d="M92 62 V46 q0-8 8-8 h14"/>
    <circle class="dg-acc-fill" cx="116" cy="38" r="4"/>
    <line class="dg-edge" x1="30" y1="62" x2="130" y2="62"/>
    <text class="dg-ink dg-h" x="80" y="-16" text-anchor="middle">One simulation</text>
    <text class="dg-muted dg-t" x="80" y="112" text-anchor="middle">a policy that works in sim</text>
  </g>

  <path class="dg-flow" d="M152 133 H196" marker-end="url(#dg-arrow)"/>

  <!-- ============ 2. the button ============ -->
  <g transform="translate(206,86)">
    <rect class="dg-btn" x="0" y="8" width="150" height="78" rx="39"/>
    <text class="dg-btnlabel" x="75" y="53" text-anchor="middle">RANDOMIZE</text>
    <text class="dg-muted dg-t" x="75" y="112" text-anchor="middle">physics + visual</text>
    <text class="dg-muted dg-t" x="75" y="127" text-anchor="middle">domain randomization</text>
  </g>

  <g class="dg-flow">
    <path d="M362 133 C392 133 396 74 424 74" marker-end="url(#dg-arrow)"/>
    <path d="M362 133 H424" marker-end="url(#dg-arrow)"/>
    <path d="M362 133 C392 133 396 192 424 192" marker-end="url(#dg-arrow)"/>
  </g>

  <!-- ============ 3. randomized environments ============ -->
  <g transform="translate(436,40)">
    <text class="dg-ink dg-h" x="128" y="-10" text-anchor="middle">10K–100K households</text>

    <g>
      <rect class="dg-tile" x="0"   y="4"   width="76" height="52" rx="6"/>
      <rect class="dg-tile" x="86"  y="4"   width="76" height="52" rx="6" opacity=".82"/>
      <rect class="dg-tile" x="172" y="4"   width="76" height="52" rx="6" opacity=".64"/>
      <rect class="dg-tile" x="0"   y="64"  width="76" height="52" rx="6" opacity=".7"/>
      <rect class="dg-tile" x="86"  y="64"  width="76" height="52" rx="6"/>
      <rect class="dg-tile" x="172" y="64"  width="76" height="52" rx="6" opacity=".8"/>
      <rect class="dg-tile" x="0"   y="124" width="76" height="52" rx="6" opacity=".6"/>
      <rect class="dg-tile" x="86"  y="124" width="76" height="52" rx="6" opacity=".74"/>
      <rect class="dg-tile" x="172" y="124" width="76" height="52" rx="6" opacity=".9"/>
    </g>

    <g class="dg-edge" opacity=".85">
      <path d="M16 44 V26 l12-9 12 9 V44 Z"/>
      <path d="M104 44 V30 l10-8 10 8 V44 Z"/>
      <path d="M190 44 V24 l14-10 14 10 V44 Z"/>
      <path d="M18 104 V88 l11-8 11 8 V104 Z"/>
      <path d="M102 104 V86 l13-9 13 9 V104 Z"/>
      <path d="M192 104 V90 l10-7 10 7 V104 Z"/>
      <path d="M14 164 V146 l13-9 13 9 V164 Z"/>
      <path d="M106 164 V150 l9-7 9 7 V164 Z"/>
      <path d="M188 164 V144 l15-10 15 10 V164 Z"/>
    </g>

    <text class="dg-muted dg-t" x="128" y="198" text-anchor="middle">textures · lighting · dynamics · friction · layout</text>
  </g>

  <path class="dg-flow" d="M700 133 H756" marker-end="url(#dg-arrow)"/>

  <!-- ============ 4. real robot ============ -->
  <g transform="translate(766,86)">
    <rect class="dg-frame" x="14" y="0" width="132" height="94" rx="8"/>
    <rect class="dg-edge" x="52" y="44" width="34" height="20" rx="3"/>
    <circle class="dg-edge" cx="60" cy="70" r="6"/>
    <circle class="dg-edge" cx="80" cy="70" r="6"/>
    <path class="dg-edge" d="M86 48 V34 q0-7 7-7 h16"/>
    <circle class="dg-acc-fill" cx="113" cy="27" r="4.5"/>
    <text class="dg-ink dg-h" x="80" y="-16" text-anchor="middle">Real robot</text>
    <text class="dg-acc dg-t dg-strong" x="80" y="112" text-anchor="middle">deploys directly</text>
  </g>

  <!-- ============ the payoff line ============ -->
  <g transform="translate(0,266)">
    <path class="dg-edge" d="M450 0 V16 H686 V0" opacity=".8"/>
    <text class="dg-muted dg-s" x="568" y="40" text-anchor="middle">
      enough diversity that the real world is&#160;<tspan class="dg-acc dg-strong">in distribution</tspan>
    </text>
  </g>

  <defs>
    <marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-acc-fill" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>
</svg>
