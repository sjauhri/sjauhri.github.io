{{- /* Layout for <figure> blocks in posts: diagrams, GIFs and video rollouts.

       Caption typography is deliberately left to the theme. PaperMod styles a
       bare <figcaption> as a bold title and a <p> inside it as the description,
       so captions here are written as <figcaption><p>…</p></figcaption> and
       inherit the theme's sizes and colours in both light and dark. Adding our
       own font rules would only lose a specificity fight with
       `.md-content figure>figcaption`. */ -}}
<style>
  .post-content figure {
    margin: 1.9em 0;
    text-align: center;
  }

  .post-content figure img,
  .post-content figure video {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
  }

  /* Diagrams read better without the frame that suits photos and rollouts. */
  .post-content figure img[src$=".svg"] {
    border-radius: 0;
  }

  /* Keep captions narrower than the image so they read as captions. */
  .post-content figure > figcaption > p {
    max-width: 46em;
    margin-inline: auto;
    line-height: 1.55;
  }

  .post-content figure > figcaption a {
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* ---------- inlined SVG diagrams ---------- */

  .post-content figure.figure-diagram svg {
    display: block;
    width: 100%;
    height: auto;
  }

  /* Light tokens are the default. */
  svg.diagram {
    --dg-ink: #0f172a;
    --dg-muted: #64748b;
    --dg-line: #cbd5e1;
    --dg-accent: #0284c7;
    --dg-accent-soft: #e0f2fe;
    --dg-tile: #eef2f7;
  }

  /* An explicit dark choice from the theme toggle. */
  html[data-theme="dark"] svg.diagram {
    --dg-ink: #e2e8f0;
    --dg-muted: #94a3b8;
    --dg-line: #334155;
    --dg-accent: #38bdf8;
    --dg-accent-soft: #0c2b3d;
    --dg-tile: #1b2534;
  }

  /* OS preference, for the no-JS case. Guarded so it never overrides an
     explicit light choice. */
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) svg.diagram {
      --dg-ink: #e2e8f0;
      --dg-muted: #94a3b8;
      --dg-line: #334155;
      --dg-accent: #38bdf8;
      --dg-accent-soft: #0c2b3d;
      --dg-tile: #1b2534;
    }
  }

  svg.diagram text { font-family: inherit; }
  svg.diagram .dg-ink { fill: var(--dg-ink); }
  svg.diagram .dg-muted { fill: var(--dg-muted); }
  svg.diagram .dg-acc { fill: var(--dg-accent); }
  svg.diagram .dg-acc-fill { fill: var(--dg-accent); }
  svg.diagram .dg-strong { font-weight: 650; }

  svg.diagram .dg-tile {
    fill: var(--dg-tile);
    stroke: var(--dg-line);
    stroke-width: 1.25;
  }

  svg.diagram .dg-edge {
    fill: none;
    stroke: var(--dg-line);
    stroke-width: 1.5;
  }

  svg.diagram .dg-flow {
    fill: none;
    stroke: var(--dg-accent);
    stroke-width: 2;
  }

  svg.diagram .dg-btn {
    fill: var(--dg-accent-soft);
    stroke: var(--dg-accent);
    stroke-width: 2;
  }

  svg.diagram .dg-frame {
    fill: none;
    stroke: var(--dg-accent);
    stroke-width: 2;
  }

  svg.diagram .dg-btnlabel {
    fill: var(--dg-accent);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }

  svg.diagram .dg-h { font-size: 15px; font-weight: 650; }
  svg.diagram .dg-s { font-size: 12.5px; }
  svg.diagram .dg-t { font-size: 11.5px; }
</style>
