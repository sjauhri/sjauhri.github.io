baseURL: "https://sjauhri.github.io/blog/"
languageCode: "en-us"
title: "The Interactive AI Blog"
theme: PaperMod
pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "The Interactive AI Blog"
  description: "Thoughts on robotics, 3D vision, reinforcement learning, and embodied AI."
  author: Snehal Jauhri
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    disableHLJS: false
    # Paths are resolved with absURL against baseURL, so keep them relative.
    # Files live in blog/static/ and are generated at blog/static/*.
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
    safari_pinned_tab: "safari-pinned-tab.svg"

  homeInfoParams:
    Title: "Hi, I'm Snehal"
    Content: >
      Postdoctoral researcher at the [3D AI Lab](https://www.3dunderstanding.org/) at TU Munich.
      I write about robotics, 3D scene understanding, reinforcement learning, and embodied AI.

      → [Back to my portfolio](/)

  socialIcons:
    - name: github
      url: "https://github.com/sjauhri"
    - name: googlescholar
      url: "https://scholar.google.com/citations?user=Hx_XWGEAAAAJ&hl=en"
    - name: email
      url: "mailto:snehal.jauhri@tum.de"

  label:
    text: "The Interactive AI Blog"
    icon: favicon-32x32.png
    iconHeight: 24

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  editPost:
    URL: "https://github.com/sjauhri/sjauhri.github.io/tree/main/blog/content"
    Text: "Suggest Changes"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    # Paths here resolve relative to baseURL (which already ends in /blog/),
    # so they must NOT be prefixed with /blog. Portfolio needs an absolute
    # URL to escape the /blog/ subpath and reach the site root.
    - identifier: portfolio
      name: Portfolio
      url: https://sjauhri.github.io/
      weight: 1
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      # Protects math from Markdown processing. Without this, Goldmark eats the
      # underscores in $\mathbb{E}_\tau$ as emphasis before math is rendered.
      passthrough:
        enable: true
        delimiters:
          block:
            - ['$$', '$$']
            - ['\[', '\]']
          inline:
            - ['$', '$']
            - ['\(', '\)']
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
