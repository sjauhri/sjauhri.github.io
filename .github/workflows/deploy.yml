name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build portfolio (static files)
        run: |
          mkdir -p _site
          # Copy the portfolio at the repo root into _site. The unquoted glob
          # skips dotfiles, so .git/ .github/ .gitmodules are excluded already.
          for item in *; do
            case "$item" in
              blog|_site) continue ;;
            esac
            cp -r "$item" _site/
          done

      - name: Build Hugo blog
        run: |
          hugo --source blog --minify \
               --baseURL "https://sjauhri.github.io/blog/" \
               --destination "$GITHUB_WORKSPACE/_site/blog"

      - name: Verify build output
        run: |
          test -f _site/index.html   || { echo "::error::portfolio index.html missing"; exit 1; }
          test -f _site/stylesheet.css || { echo "::error::stylesheet.css missing"; exit 1; }
          test -d _site/images       || { echo "::error::images/ missing"; exit 1; }
          test -f _site/blog/index.html || { echo "::error::blog index.html missing"; exit 1; }
          test ! -e _site/.git       || { echo "::error::.git leaked into _site"; exit 1; }
          echo "Build output verified."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
